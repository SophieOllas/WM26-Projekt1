<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <label for="boardSelect" class="board-label">Board:</label>
        <select id="boardSelect">
          <option value="2">Projektplanering</option>
        </select>
        <button id="newNoteBtn" class="primary-btn">New Note</button>
      </header>

      <main id="board" class="board" aria-label="Board area"></main>
    </div>

    <div id="loginModal" class="modal visible">
      <div class="modal-card">
        <h2>Login</h2>
        <form id="loginForm">
          <input id="email" type="email" placeholder="Email" required />
          <input id="password" type="password" placeholder="Password" required />
          <button type="submit" class="primary-btn">Login</button>
        </form>
        <p id="loginError" class="error"></p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
